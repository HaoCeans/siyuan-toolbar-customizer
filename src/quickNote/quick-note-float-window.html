<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <meta name="quick-note-float" content="toolbar-customizer" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    :root {
      color-scheme: light dark;
      --panel-bg: #ffffff;
      --panel-border: rgba(0, 0, 0, 0.08);
      --editor-bg: #ffffff;
      --text: #1f2329;
      --muted: #8a9099;
      --line-strong: rgba(0, 0, 0, 0.16);
      --primary: #3b82f6;
      --primary-hover: #2f6fe0;
      --ghost-bg: rgba(0, 0, 0, 0.05);
      --ghost-hover: rgba(0, 0, 0, 0.09);
    }
    html[data-theme-mode="dark"] {
      --panel-bg: #1e1e1e;
      --panel-border: rgba(255, 255, 255, 0.08);
      --editor-bg: #1e1e1e;
      --text: #e5e7eb;
      --muted: #8b949e;
      --line-strong: rgba(255, 255, 255, 0.18);
      --primary: #3b82f6;
      --primary-hover: #4b8df8;
      --ghost-bg: rgba(255, 255, 255, 0.06);
      --ghost-hover: rgba(255, 255, 255, 0.10);
    }
    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
    }
    .qnote-panel {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: none;
    }
    .qnote-header {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 12px;
      background: transparent;
      border-bottom: none;
      -webkit-app-region: drag;
      cursor: move;
      user-select: none;
    }
    .qnote-header::before {
      content: "";
      width: 26px;
      height: 4px;
      flex: 0 0 auto;
      border-radius: 2px;
      background: var(--line-strong);
      opacity: 0.7;
    }
    .qnote-title {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 400;
      letter-spacing: 0.02em;
      opacity: 0.85;
    }
    .qnote-close {
      width: 22px;
      height: 22px;
      margin-left: auto;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      -webkit-app-region: no-drag;
      font-size: 15px;
      line-height: 1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .qnote-close:hover {
      background: var(--ghost-hover);
      color: var(--text);
    }
    .qnote-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 2px 18px 0;
      min-height: 0;
      background: var(--editor-bg);
      -webkit-app-region: no-drag;
    }
    textarea {
      flex: 1;
      width: 100%;
      min-height: 40px;
      resize: none;
      border: none;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      padding: 0;
      font-family: inherit;
      font-size: min(var(--qnote-font-size, 14px), 20px);
      line-height: 1.8;
      outline: none;
      caret-color: var(--primary);
      transition: none;
    }
    textarea::placeholder {
      color: var(--muted);
      opacity: 0.6;
    }
    textarea:focus {
      border: none;
      box-shadow: none;
    }
    .qnote-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 18px 12px;
      -webkit-app-region: no-drag;
    }
    .qnote-foot-left {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .qnote-hint {
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.4;
      opacity: 0.8;
      -webkit-app-region: no-drag;
    }
    .qnote-hint:empty {
      display: none;
    }
    .qnote-hint kbd {
      display: inline-block;
      padding: 1px 4px;
      border: 1px solid var(--panel-border);
      border-bottom-width: 2px;
      border-radius: 3px;
      background: var(--ghost-bg);
      color: var(--text);
      font-family: inherit;
      font-size: 9.5px;
      line-height: 1.2;
    }
    .qnote-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      background: transparent;
      border: none;
      -webkit-app-region: no-drag;
    }
    .qnote-cancel {
      height: 28px;
      padding: 0 2px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.15s;
    }
    .qnote-cancel:hover {
      color: var(--text);
    }
    .qnote-send {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
      transition: background 0.15s, transform 0.1s;
    }
    .qnote-send:hover { background: var(--primary-hover); }
    .qnote-send:active { transform: scale(0.95); }
    .qnote-send:disabled { opacity: 0.5; cursor: default; }
    .qnote-send svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
    .status {
      min-height: 0;
      padding: 0;
      color: var(--muted);
      font-size: 10.5px;
      line-height: 1.4;
      text-align: left;
      -webkit-app-region: no-drag;
    }
    .status:empty {
      display: none;
      padding: 0;
    }
    .status.ok { color: #16a34a; }
    .status.err { color: #dc2626; }
  </style>
</head>
<body>
  <div id="app">
    <div class="qnote-panel">
      <div class="qnote-header">
        <div class="qnote-title" id="title"></div>
        <button class="qnote-close" id="closeBtn" title="" aria-label="">×</button>
      </div>
      <div class="qnote-body">
        <textarea id="input" placeholder=""></textarea>
      </div>
      <div class="qnote-foot">
        <div class="qnote-foot-left">
          <div class="qnote-hint" id="hint"></div>
          <div class="status" id="status"></div>
        </div>
        <div class="qnote-actions">
          <button class="qnote-cancel" id="cancelBtn" type="button"></button>
          <button class="qnote-send" id="saveBtn" type="button" aria-label="发送" title="发送">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function() {
      const MAIN_WINDOW_ID = (typeof __MAIN_WINDOW_ID__ !== 'undefined') ? __MAIN_WINDOW_ID__ : 0;
      const titleEl = document.getElementById('title');
      const inputEl = document.getElementById('input');
      const statusEl = document.getElementById('status');
      const saveBtn = document.getElementById('saveBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const closeBtn = document.getElementById('closeBtn');
      const hintEl = document.getElementById('hint');
      let ui = {};
      let floatSelfWindow = null;

      try {
        const remote = require('@electron/remote');
        floatSelfWindow = remote && remote.getCurrentWindow ? remote.getCurrentWindow() : null;
      } catch (e) {}

      function setTheme(isDark) {
        document.documentElement.setAttribute('data-theme-mode', isDark ? 'dark' : 'light');
      }

      window.__setQuickNoteFloatTheme = setTheme;

      window.__setQuickNoteFloatState = function(payload) {
        if (!payload) return;
        if (typeof payload.isDark === 'boolean') setTheme(payload.isDark);
        if (payload.locale) document.documentElement.lang = payload.locale;
        if (payload.ui) {
          ui = payload.ui;
          document.title = ui.documentTitle || '';
          closeBtn.title = ui.close || '';
          closeBtn.setAttribute('aria-label', ui.close || '');
          cancelBtn.textContent = ui.cancel || '';
          saveBtn.setAttribute('aria-label', ui.send || '');
          saveBtn.title = ui.send || '';
          hintEl.innerHTML = ui.keyboardHint || '';
        }
        if (payload.title) titleEl.textContent = payload.title;
        if (payload.placeholder) inputEl.placeholder = payload.placeholder;
        if (typeof payload.fontSize === 'number' && payload.fontSize > 0) {
          document.documentElement.style.setProperty('--qnote-font-size', payload.fontSize + 'px');
          // 由 CSS 的 min() 统一限制上限，占位文字与输入文字保持同字号
          inputEl.style.fontSize = '';
        }
        if (payload.initialText) {
          inputEl.value = payload.initialText;
        } else if (payload.clear) {
          inputEl.value = '';
        }
        if (payload.status) {
          statusEl.textContent = payload.status.text || '';
          statusEl.className = 'status' + (payload.status.type ? (' ' + payload.status.type) : '');
        } else {
          statusEl.textContent = '';
          statusEl.className = 'status';
        }
        if (payload.focus !== false) {
          inputEl.focus();
          const len = inputEl.value.length;
          inputEl.setSelectionRange(len, len);
        }
      };

      function sendToMain(cmd, data) {
        try {
          const remote = require('@electron/remote');
          const BrowserWindow = remote.BrowserWindow;
          let mainWindow = null;
          if (MAIN_WINDOW_ID) {
            try { mainWindow = BrowserWindow.fromId(MAIN_WINDOW_ID); } catch (e) {}
          }
          if (!mainWindow) {
            const all = BrowserWindow.getAllWindows ? BrowserWindow.getAllWindows() : [];
            const selfId = remote.getCurrentWindow()?.id;
            mainWindow = all.find(function(w) { return w && w.id !== selfId; }) || null;
          }
          if (!mainWindow || !mainWindow.webContents) return;
          const encoded = data ? encodeURIComponent(JSON.stringify(data)) : '';
          const code = encoded
            ? 'window.__quickNoteFloatCommand && window.__quickNoteFloatCommand("' + cmd + '", decodeURIComponent("' + encoded + '"))'
            : 'window.__quickNoteFloatCommand && window.__quickNoteFloatCommand("' + cmd + '")';
          mainWindow.webContents.executeJavaScript(code).catch(function() {});
        } catch (e) {}
      }

      function closeSelf() {
        sendToMain('cancel');
        // 不再直接调用 floatSelfWindow.close()：
        // 主进程收到 'cancel' 后会隐藏窗口（保持存活），close 拦截器是安全兜底
      }

      saveBtn.addEventListener('click', function() {
        const text = (inputEl.value || '').trim();
        if (!text) {
          statusEl.textContent = ui.emptyContent || '';
          statusEl.className = 'status err';
          inputEl.focus();
          return;
        }
        saveBtn.disabled = true;
        statusEl.textContent = ui.sending || '';
        statusEl.className = 'status';
        sendToMain('save', { text: text });
        window.setTimeout(function() { saveBtn.disabled = false; }, 800);
      });

      cancelBtn.addEventListener('click', closeSelf);
      closeBtn.addEventListener('click', closeSelf);

      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          closeSelf();
        } else if (e.key === 'Enter' && e.shiftKey) {
          e.preventDefault();
          saveBtn.click();
        }
      });

      // 主窗口退出时自动关闭（有限次数检测，避免无限轮询浪费资源）
      try {
        const remote = require('@electron/remote');
        const BrowserWindow = remote.BrowserWindow;
        if (BrowserWindow && floatSelfWindow) {
          var mainWinCheckCount = 0;
          var mainWinCheckTimer = window.setInterval(function() {
            mainWinCheckCount++;
            try {
              if (MAIN_WINDOW_ID > 0) {
                var w = BrowserWindow.fromId(MAIN_WINDOW_ID);
                if (!w || (w.isDestroyed && w.isDestroyed())) {
                  try { floatSelfWindow.destroy ? floatSelfWindow.destroy() : floatSelfWindow.close(); } catch (e2) {}
                  clearInterval(mainWinCheckTimer);
                  return;
                }
              }
            } catch (e) {
              try { floatSelfWindow.destroy ? floatSelfWindow.destroy() : floatSelfWindow.close(); } catch (e2) {}
              clearInterval(mainWinCheckTimer);
              return;
            }
            // 最多检测 300 次（约 6 分钟），之后停止轮询
            // 主进程 destroy() 是更可靠的生命周期管理方式
            if (mainWinCheckCount >= 300) {
              clearInterval(mainWinCheckTimer);
            }
          }, 1200);
        }
      } catch (e) {}

      sendToMain('ready');
      inputEl.focus();
    })();
  </script>
</body>
</html>
